            "ClrType": "System.String, mscorlib, Version=4.0.0.0, Culture=neutral, PublicKeyToken=b77a5c561934e089",
            "EffectiveType": "enum",
            "DefaultValue": "ir-interpreter"
          },
          {
            "Name": "pspModel",
            "Display": "PSP Model",
            "Description": "Which machine this is. The PSP-2000 (Slim) has 64MB of RAM, the PSP-1000 has 32MB; a handful of games use the extra memory. Shapes the machine, so changing it reboots the core and movies record it.",
            "Type": "enum",
            "Default": "psp-2000",
            "Options": [
              "psp-1000",
              "psp-2000"
            ],
            "Min": null,
            "Max": null,
            "Sync": true,
            "DisplayName": "PSP Model",
            "ClrType": "System.String, mscorlib, Version=4.0.0.0, Culture=neutral, PublicKeyToken=b77a5c561934e089",
            "EffectiveType": "enum",
            "DefaultValue": "psp-2000"
          },
          {
            "Name": "language",
            "Display": "System Language",
            "Description": "The console's language system parameter. Games read it at boot to pick their language, so it shapes the machine.",
            "Type": "enum",
            "Default": "english",
            "Options": [
              "japanese",
              "english",
              "french",
              "spanish",
              "german",
              "italian",
