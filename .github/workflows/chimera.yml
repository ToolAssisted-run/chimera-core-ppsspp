name: chimera waterbox core

# The core as Chimera ships it: a sandboxed core.wbx package. Both jobs run
# only over pspautotests content vendored via the PPSSPP submodule (free to
# distribute), so they need nothing provisioned and run on public runners.

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CHIMERA_REF: main

jobs:

  core-gate:
    # The fast half: the sandboxed core must emulate byte-identically to the
    # same sources built for the host, and survive a savestate round-trip
    # around every frame. No .NET, Mono or X involved.
    name: core gate (native == sandbox == rerecord)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Check out PPSSPP (pinned submodule) and its parts
        run: |
          git submodule update --init --depth 1 extern/ppsspp
          cd extern/ppsspp
          git submodule update --init --depth 1 \
            ext/zstd ext/cpu_features ext/rapidjson ext/libchdr ext/lua \
            ext/aemu_postoffice pspautotests ffmpeg

      - name: Check out Chimera (for the miniBox waterbox host and toolchain)
        uses: actions/checkout@v6
        with:
          repository: ToolAssisted-run/chimera
          ref: ${{ env.CHIMERA_REF }}
          path: chimera-checkout
          submodules: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build build-essential python3

      - name: Check out miniBox
        working-directory: chimera-checkout
        run: git submodule update --init extern/tools/chimera-common-minibox

      - name: Cache the guest toolchain
        uses: actions/cache@v4
        with:
          path: chimera-checkout/extern/tools/chimera-common-minibox/build/meson-cpp
          key: guest-cpp-${{ runner.os }}-${{ hashFiles('chimera-checkout/extern/tools/chimera-common-minibox/.git') }}-${{ hashFiles('chimera-checkout/extern/tools/chimera-common-minibox/meson.build') }}

      - name: Build miniBox (host + C++ guest toolchain)
        run: |
          mb="$PWD/chimera-checkout/extern/tools/chimera-common-minibox"
          [ -f "$mb/build/meson-cpp/build.ninja" ] || meson setup "$mb/build/meson-cpp" "$mb" -Dguest_cpp=true
          meson compile -C "$mb/build/meson-cpp"

      - name: Build the waterbox core
        # also applies patches/ onto the pristine submodule checkout
        run: ./waterbox/build-core.sh -m "$PWD/chimera-checkout/extern/tools/chimera-common-minibox"

      - name: Build the native reference
        working-directory: waterbox
        run: make -f native.mk -j"$(nproc)" native

      - name: Core gate over free pspautotests
        run: ./waterbox/run-gate.sh

      - name: Upload core.wbx
        uses: actions/upload-artifact@v7
        with:
          name: core-wbx
          path: |
            waterbox/bin/core.wbx
            waterbox/waterbox.config
          retention-days: 90

  frontend-gate:
    # The other half: the package running inside the real frontend (Chimera
    # headless under Mono + Xvfb, through the generic waterbox adapter). The
    # emulated RAM must match the native reference, and the package's default
    # keybinds must become the frontend's.
    name: frontend gate (Chimera)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Check out PPSSPP (pinned submodule) and its parts
        run: |
          git submodule update --init --depth 1 extern/ppsspp
          cd extern/ppsspp
          git submodule update --init --depth 1 \
            ext/zstd ext/cpu_features ext/rapidjson ext/libchdr ext/lua \
            ext/aemu_postoffice pspautotests ffmpeg

      - name: Check out Chimera
        uses: actions/checkout@v6
        with:
          repository: ToolAssisted-run/chimera
          ref: ${{ env.CHIMERA_REF }}
          path: chimera-checkout
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build build-essential cmake pkg-config python3 \
            mono-complete xvfb \
            libgl1-mesa-dev libx11-dev libxext-dev libasound2-dev

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Build Chimera native dependencies
        working-directory: chimera-checkout
        run: |
          meson setup build/meson-linux --prefix "$PWD/build" --libdir dll
          meson compile -C build/meson-linux
          meson install -C build/meson-linux

      - name: Build the Chimera solution
        working-directory: chimera-checkout
        run: dotnet build source/Chimera.sln -c Release /nodeReuse:false -p:UseSharedCompilation=false

      - name: Build and install the waterbox core package
        # The commit is the core's authoritative version: this build is the one
        # that publishes the artifact, so what it stamps is what a movie can
        # cite. A package built by hand stamps "+local" instead.
        env:
          CORE_VERSION: ${{ github.sha }}
        run: ./waterbox/build-package.sh -r "$PWD/chimera-checkout"

      - name: Build the native reference (the gate's comparison side)
        working-directory: waterbox
        run: make -f native.mk -j"$(nproc)" native

      - name: Frontend gate
        run: ./waterbox/tests/run-frontend.sh --chimera-root "$GITHUB_WORKSPACE/chimera-checkout"

      - name: Publish the core package
        uses: actions/upload-artifact@v7
        with:
          name: ppsspp-${{ github.sha }}
          path: chimera-checkout/build/Cores/ppsspp.zip
          if-no-files-found: error

      - name: Upload the frontend work dir on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-gate-work
          path: waterbox/tests/work/
